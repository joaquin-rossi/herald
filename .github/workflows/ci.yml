name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.10", "9.12", "9.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --enable-tests --dry-run

      - uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct

      - name: Documentation
        run: cabal haddock herald

      - name: Package check
        run: cabal check

  doctest:
    name: Doctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10"
          cabal-version: latest

      - name: Resolve dependencies
        run: |
          cabal update
          cabal build herald --dry-run

      - uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-doctest-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-doctest-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Install doctest
        run: |
          cabal install doctest --ignore-project --overwrite-policy=always --installdir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run doctest
        run: |
          cabal build herald
          cabal repl herald --with-compiler=doctest --repl-options='-w -Wdefault'

  ormolu:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # haskell-actions/run-ormolu downloads from a repository that no longer
      # hosts the releases, so fetch the pinned version directly.
      - name: Install ormolu
        run: |
          curl -sSfL -o ormolu.zip https://github.com/tweag/ormolu/releases/download/0.9.0.0/ormolu-x86_64-linux.zip
          unzip -q ormolu.zip -d "$RUNNER_TEMP/ormolu"
          echo "$RUNNER_TEMP/ormolu" >> "$GITHUB_PATH"

      - name: Check formatting
        run: ormolu --mode check --check-idempotence $(git ls-files '*.hs')
